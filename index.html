<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #05060a; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden-node { display: none !important; }
        input { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white; text-align: center; }
        .btn-blue { background: linear-gradient(135deg, #6366f1, #4338ca); }
        .admin-btn { position: fixed; top: 10px; left: 10px; width: 40px; height: 40px; z-index: 999; opacity: 0.1; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="admin-trigger" onclick="handleAdminClick()" class="admin-btn">Q</div>

    <div id="app" class="w-full max-w-md">
        <div id="site-lock" class="glass p-10 rounded-[2rem] text-center">
            <h2 class="text-xl font-bold mb-6 uppercase tracking-widest">Введите пароль</h2>
            <input type="password" id="site-pass" placeholder="••••" class="w-full p-4 rounded-xl mb-4 outline-none">
            <button onclick="checkSitePass()" class="btn-blue w-full py-4 rounded-xl font-bold uppercase mb-4">Войти</button>
            <button onclick="window.location.href='https://t.me/mimimimimoooo7'" class="text-indigo-400 text-sm">Узнать пароль</button>
        </div>

        <div id="auth-screen" class="hidden-node glass p-8 rounded-[2rem] text-center">
            <h2 id="auth-title" class="text-2xl font-bold mb-8">ВОЙТИ</h2>
            <div id="reg-fields" class="mb-4 hidden-node">
                <input type="text" id="avatar" placeholder="🚀" maxlength="2" class="w-20 p-3 text-3xl rounded-xl mx-auto block">
            </div>
            <div class="space-y-4">
                <input type="text" id="login" placeholder="@логин" class="w-full p-4 rounded-xl outline-none">
                <input type="password" id="pass" placeholder="Пароль" class="w-full p-4 rounded-xl outline-none">
            </div>
            <button onclick="handleAuth()" id="auth-btn" class="btn-blue w-full py-4 rounded-xl font-bold mt-8 uppercase">Войти</button>
            <button onclick="toggleMode()" id="mode-btn" class="mt-4 text-gray-500 text-sm uppercase font-bold">Регистрация</button>
        </div>

        <div id="main-screen" class="hidden-node space-y-4 w-full">
            <div class="glass p-6 rounded-[2rem] text-center">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="openEdit()" class="text-[10px] uppercase font-bold text-gray-400 border border-white/10 px-3 py-1 rounded-full">Профиль</button>
                    <div class="flex items-center text-[10px] font-bold">
                        <div id="adm-dot" class="w-2 h-2 rounded-full mr-2 bg-red-500"></div>
                        ADMIN: <span id="adm-txt" class="ml-1 uppercase">Off</span>
                    </div>
                </div>
                <div id="u-avatar" class="text-6xl mb-2">🚀</div>
                <div id="u-name" class="text-lg font-bold text-indigo-400 mb-4">@user</div>
                <div class="bg-white/5 py-6 rounded-2xl mb-4">
                    <p class="text-[10px] text-gray-500 uppercase mb-1">Твое место</p>
                    <p id="pos" class="text-5xl font-black">#--</p>
                </div>
                
                <div class="text-left mt-6">
                    <p class="text-[10px] text-gray-500 uppercase font-bold mb-3">Кто в очереди:</p>
                    <div id="public-queue" class="space-y-2 max-h-32 overflow-y-auto pr-2"></div>
                </div>
            </div>

            <div class="glass p-4 rounded-3xl">
                <div id="chat" class="h-32 overflow-y-auto text-left text-[11px] mb-3 space-y-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="msg-input" placeholder="Чат..." class="flex-1 p-3 rounded-xl text-xs">
                    <button onclick="sendMsg()" class="btn-blue px-4 rounded-xl">></button>
                </div>
            </div>
        </div>

        <div id="admin-screen" class="hidden-node glass p-6 rounded-[2rem] w-full">
            <div class="flex justify-between mb-4 items-center">
                <h2 class="font-bold text-indigo-400">ADMIN PANEL</h2>
                <button onclick="location.reload()" class="text-red-500 text-xs font-bold uppercase">Выход</button>
            </div>
            <button onclick="toggleAdminStatus()" id="adm-status-btn" class="w-full mb-4 py-2 rounded-xl bg-white/5 text-[10px] font-bold"></button>
            <div id="admin-list" class="space-y-2 mb-4 max-h-60 overflow-y-auto"></div>
            <div class="flex gap-2">
                <input type="text" id="adm-msg" placeholder="Сообщение админа..." class="flex-1 p-3 rounded-xl text-xs">
                <button onclick="sendAdmMsg()" class="btn-blue px-4 rounded-xl">OK</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden-node fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-[1000]">
        <div class="glass p-8 rounded-3xl w-full max-w-sm text-center">
            <h3 class="font-bold mb-6 uppercase">Профиль</h3>
            <input type="text" id="new-av" class="w-full p-4 rounded-xl text-4xl mb-4">
            <input type="text" id="new-log" class="w-full p-4 rounded-xl mb-6 font-bold">
            <button onclick="saveEdit()" class="btn-blue w-full py-4 rounded-xl font-bold mb-3">СОХРАНИТЬ</button>
            <button onclick="deleteAccount()" class="w-full py-3 rounded-xl bg-red-500/10 text-red-500 text-xs font-bold mb-6 uppercase">Удалить аккаунт</button>
            <button onclick="closeEdit()" class="text-gray-500 text-xs uppercase">Закрыть</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://ezqwyxcybuqhjsnjpuoe.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6cXd5eGN5YnVxaGpzbmpwdW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MDExMTIsImV4cCI6MjA4NjQ3NzExMn0.BX7jXhMzSAef3ln5wy8le6nG45me4KnFRbi66482uYo";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null;
        let isLogin = true;
        let config = { site_pass: "1234", admin_online: false };
        let clicks = 0;

        async function init() {
            const { data } = await _supabase.from('settings').select('*').eq('id', 1).single();
            if (data) config = data;
            setInterval(sync, 5000);
        }

        async function sync() {
            const { data } = await _supabase.from('settings').select('*').eq('id', 1).single();
            if (data) {
                config = data;
                const d = document.getElementById('adm-dot');
                const t = document.getElementById('adm-txt');
                if(d && t) {
                    d.className = `w-2 h-2 rounded-full mr-2 ${config.admin_online ? 'bg-green-500' : 'bg-red-500'}`;
                    t.innerText = config.admin_online ? 'On' : 'Off';
                }
            }
            if(currentUser) { updatePos(); updatePublicQueue(); loadMsgs(); }
        }

        function checkSitePass() {
            const val = document.getElementById('site-pass').value;
            if (val === config.site_pass || val === "1234") {
                document.getElementById('site-lock').classList.add('hidden-node');
                document.getElementById('auth-screen').classList.remove('hidden-node');
            } else alert("Неверный пароль!");
        }

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "ВОЙТИ" : "РЕГИСТРАЦИЯ";
            document.getElementById('auth-btn').innerText = isLogin ? "Войти" : "Создать";
            document.getElementById('reg-fields').classList.toggle('hidden-node', isLogin);
        }

        async function handleAuth() {
            let log = document.getElementById('login').value.trim();
            let pas = document.getElementById('pass').value.trim();
            if(!log || !pas) return alert("Заполни всё!");
            if(!log.startsWith('@')) log = '@' + log;

            if (isLogin) {
                const { data } = await _supabase.from('queue').select('*').eq('tg_login', log).eq('password', pas).single();
                if(!data) return alert("Неверный логин или пароль!");
                currentUser = data;
            } else {
                const { data, error } = await _supabase.from('queue').insert([{ tg_login: log, password: pas, avatar: document.getElementById('avatar').value || '👤' }]).select();
                if(error) return alert("Логин занят!");
                currentUser = data[0];
            }
            startApp();
        }

        function startApp() {
            document.getElementById('auth-screen').classList.add('hidden-node');
            document.getElementById('main-screen').classList.remove('hidden-node');
            document.getElementById('u-avatar').innerText = currentUser.avatar;
            document.getElementById('u-name').innerText = currentUser.tg_login;
            sync();
        }

        async function updatePos() {
            const { data } = await _supabase.from('queue').select('id').order('created_at', { ascending: true });
            const p = data.findIndex(i => i.id === currentUser.id) + 1;
            document.getElementById('pos').innerText = p > 0 ? '#' + p : '---';
        }

        async function updatePublicQueue() {
            const { data } = await _supabase.from('queue').select('avatar, tg_login').order('created_at', { ascending: true });
            document.getElementById('public-queue').innerHTML = data.map((u, i) => `
                <div class="flex items-center gap-2 text-[11px] bg-white/5 p-2 rounded-lg">
                    <span class="text-gray-500 font-bold">${i+1}.</span>
                    <span>${u.avatar}</span>
                    <span class="${u.tg_login === currentUser.tg_login ? 'text-indigo-400 font-bold' : ''}">${u.tg_login}</span>
                </div>
            `).join('');
        }

        async function loadMsgs() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(20);
            document.getElementById('chat').innerHTML = data.map(m => `<div><b class="${m.sender === 'ADMIN' ? 'text-indigo-400' : 'text-gray-500'}">${m.sender}:</b> ${m.text}</div>`).join('');
        }

        async function sendMsg() {
            const t = document.getElementById('msg-input').value;
            if(!t) return;
            await _supabase.from('messages').insert([{ sender: currentUser.tg_login, text: t }]);
            document.getElementById('msg-input').value = '';
            loadMsgs();
        }

        function handleAdminClick() {
            clicks++;
            if(clicks >= 15) {
                const p = prompt("ADMIN PASS:");
                if(p === "2010Max0102") {
                    document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden-node'));
                    document.getElementById('admin-screen').classList.remove('hidden-node');
                    loadAdmList();
                } else { alert("Wrong!"); }
                clicks = 0;
            }
        }

        async function loadAdmList() {
            const { data } = await _supabase.from('queue').select('*').order('created_at', { ascending: true });
            document.getElementById('admin-list').innerHTML = data.map((u, i) => `
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl text-xs">
                    <div class="flex items-center gap-2"><span>${u.avatar}</span><b>${u.tg_login}</b></div>
                    <button onclick="delUser('${u.id}')" class="text-red-500 font-bold">УДАЛИТЬ</button>
                </div>
            `).join('');
            document.getElementById('adm-status-btn').innerText = config.admin_online ? "MY STATUS: ONLINE" : "MY STATUS: OFFLINE";
        }

        async function toggleAdminStatus() {
            await _supabase.from('settings').update({ admin_online: !config.admin_online }).eq('id', 1);
            sync(); setTimeout(loadAdmList, 500);
        }

        async function delUser(id) { if(confirm("Удалить пользователя?")) { await _supabase.from('queue').delete().eq('id', id); loadAdmList(); } }

        async function deleteAccount() {
            if(confirm("Удалить свой аккаунт навсегда?")) {
                await _supabase.from('queue').delete().eq('id', currentUser.id);
                location.reload();
            }
        }

        function openEdit() {
            document.getElementById('edit-modal').classList.remove('hidden-node');
            document.getElementById('new-av').value = currentUser.avatar;
            document.getElementById('new-log').value = currentUser.tg_login;
        }
        function closeEdit() { document.getElementById('edit-modal').classList.add('hidden-node'); }
        async function saveEdit() {
            await _supabase.from('queue').update({ avatar: document.getElementById('new-av').value, tg_login: document.getElementById('new-log').value }).eq('id', currentUser.id);
            location.reload();
        }

        async function sendAdmMsg() {
            const t = document.getElementById('adm-msg').value;
            if(t) await _supabase.from('messages').insert([{ sender: 'ADMIN', text: t }]);
            document.getElementById('adm-msg').value = '';
        }

        init();
    </script>
</body>
</html>
