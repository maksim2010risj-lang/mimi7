<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mimi7osApp</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseAdmin { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes neonGlow { 0% { text-shadow: 0 0 10px #6366f1; } 50% { text-shadow: 0 0 25px #6366f1, 0 0 10px #818cf8; } 100% { text-shadow: 0 0 10px #6366f1; } }
        
        body { background: #05060a; color: white; font-family: sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); animation: fadeIn 0.6s ease-out; }
        .hidden-node { display: none !important; }
        
        input, textarea { 
            background: rgba(255, 255, 255, 0.05) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            color: white !important; 
            text-align: center;
        }

        .btn-blue { background: linear-gradient(135deg, #6366f1, #4338ca); transition: 0.2s; }
        .tab-active { border-bottom: 2px solid #6366f1; color: white !important; }
        .pos-first { color: #6366f1; animation: neonGlow 2s infinite; }
        .admin-status-on { color: #10b981; animation: pulseAdmin 2s infinite; font-weight: 900; }
        
        .admin-btn { position: fixed; top: 10px; left: 10px; width: 40px; height: 40px; z-index: 999; opacity: 0.01; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div onclick="handleAdminClick()" class="admin-btn"></div>

    <div id="app" class="w-full max-w-md">
        <div id="site-lock" class="glass p-10 rounded-[2rem] text-center">
            <h2 class="text-2xl font-black mb-6 uppercase italic text-indigo-500">mimi7osApp</h2>
            <input type="password" id="site-pass" placeholder="ПАРОЛЬ" class="w-full p-4 rounded-xl mb-4 outline-none">
            <button onclick="checkSitePass()" class="btn-blue w-full py-4 rounded-xl font-bold uppercase">Войти</button>
        </div>

        <div id="auth-screen" class="hidden-node glass p-8 rounded-[2rem] text-center">
            <h2 id="auth-title" class="text-2xl font-bold mb-8 uppercase tracking-widest">Войти</h2>
            <div id="reg-fields" class="mb-4 hidden-node">
                <p class="text-[10px] text-gray-500 mb-2 uppercase italic">Эмодзи-аватар:</p>
                <input type="text" id="avatar" placeholder="🚀" maxlength="2" class="w-20 p-3 text-3xl rounded-xl mx-auto block outline-none text-center">
            </div>
            <div class="space-y-4">
                <input type="text" id="login" placeholder="@логин_телеграм" class="w-full p-4 rounded-xl outline-none text-center">
                <input type="password" id="pass" placeholder="ПАРОЛЬ" class="w-full p-4 rounded-xl outline-none text-center">
            </div>
            <button onclick="handleAuth()" id="auth-main-btn" class="btn-blue w-full py-4 rounded-xl font-bold mt-8 uppercase">ОК</button>
            <button onclick="toggleMode()" id="mode-btn" class="mt-4 text-gray-500 text-[10px] uppercase font-bold tracking-widest">Регистрация</button>
            <button onclick="closeProfile()" id="cancel-btn" class="mt-2 text-red-500 text-[10px] uppercase font-bold tracking-widest hidden-node">Отмена</button>
        </div>

        <div id="main-screen" class="hidden-node space-y-4 w-full">
            <div class="glass p-6 rounded-[2rem] text-center">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="openProfileEdit()" class="text-[10px] text-gray-400 uppercase font-bold border border-white/5 px-3 py-1 rounded-lg">Профиль</button>
                    <div id="admin-status-text" class="text-[10px] uppercase tracking-widest text-red-500">Admin Offline</div>
                </div>
                <div id="u-avatar" class="text-7xl mb-2">🚀</div>
                <div id="u-name" class="text-lg font-bold text-indigo-400 mb-4">@user</div>
                
                <div class="bg-white/5 py-4 rounded-2xl mb-4 border border-white/10">
                    <p class="text-[9px] text-gray-500 uppercase font-bold mb-1 tracking-widest">Место в очереди</p>
                    <p id="pos" class="text-6xl font-black italic">#--</p>
                </div>

                <div id="vip-block" class="grid grid-cols-2 gap-2 mb-6">
                    <button onclick="buyVip(5, 15)" class="bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 py-3 rounded-xl text-[9px] font-bold uppercase leading-tight">Обогнать 5 чел<br>15 ⭐</button>
                    <button onclick="buyVip(15, 25)" class="bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 py-3 rounded-xl text-[9px] font-bold uppercase leading-tight">Обогнать 15 чел<br>25 ⭐</button>
                </div>
                
                <div id="public-queue" class="text-left space-y-2 max-h-24 overflow-y-auto text-[10px] opacity-60 border-t border-white/5 pt-3"></div>
            </div>

            <div class="glass p-4 rounded-3xl">
                <div class="flex border-b border-white/10 mb-3 text-[10px] font-bold uppercase">
                    <button id="tab-common" onclick="switchChat('common')" class="flex-1 pb-2 tab-active">Общий</button>
                    <button id="tab-private" onclick="switchChat('private')" class="flex-1 pb-2 text-gray-500 hidden-node">ЛС Админ</button>
                </div>
                <div id="chat-box" class="h-44 overflow-y-auto text-left text-[11px] mb-3 space-y-2 pr-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="msg-input" placeholder="Написать..." class="flex-1 p-3 rounded-xl text-xs outline-none text-left px-4">
                    <button onclick="sendMsg()" class="btn-blue px-5 rounded-xl font-bold">></button>
                </div>
            </div>
        </div>

        <div id="admin-screen" class="hidden-node glass p-6 rounded-[2rem] w-full max-w-lg text-center">
            <div class="flex justify-between mb-4 items-center border-b border-white/10 pb-4">
                <h2 class="font-bold text-indigo-400 text-sm uppercase italic tracking-widest">ADM PANEL</h2>
                <button onclick="location.reload()" class="text-red-500 text-[9px] border border-red-500/20 px-2 py-1 rounded font-bold uppercase">Выход</button>
            </div>

            <div id="adm-chat-view" class="h-32 overflow-y-auto mb-4 p-2 bg-black/40 rounded-xl text-[10px] space-y-1 border border-white/10 text-left"></div>

            <div id="admin-list" class="space-y-1 mb-4 max-h-40 overflow-y-auto text-[10px]"></div>

            <div class="bg-indigo-500/5 p-3 rounded-2xl border border-indigo-500/10 mb-4">
                <p class="text-[9px] text-indigo-400 font-bold mb-2 uppercase">ЛС ПЕРВОМУ (@<span id="first-user-name">...</span>):</p>
                <div class="flex gap-2">
                    <input type="text" id="adm-msg" placeholder="Текст..." class="flex-1 p-3 rounded-xl text-xs outline-none text-left px-4">
                    <button onclick="sendAdmMsg()" class="btn-blue px-4 rounded-xl font-bold text-xs uppercase">Send</button>
                </div>
                <button onclick="sendAdmToAll()" class="w-full mt-2 py-1 text-[8px] opacity-50 uppercase font-black tracking-widest">Опубликовать в общий чат</button>
            </div>

            <div class="space-y-2">
                <textarea id="admin-notes" oninput="saveNotes()" class="w-full h-20 p-3 rounded-2xl text-[10px] outline-none resize-none text-left" placeholder="Блокнот для заметок..."></textarea>
                <button onclick="clearChatNow()" class="w-full py-3 rounded-xl bg-red-600/20 text-red-500 border border-red-500/30 text-[10px] font-black uppercase tracking-widest">Очистить весь чат</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://ezqwyxcybuqhjsnjpuoe.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6cXd5eGN5YnVxaGpzbmpwdW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MDExMTIsImV4cCI6MjA4NjQ3NzExMn0.BX7jXhMzSAef3ln5wy8le6nG45me4KnFRbi66482uYo";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null, isLogin = true, isEditMode = false, clicks = 0, config = { admin_online: false }, activeTab = 'common';

        async function init() {
            const { data } = await _supabase.from('settings').select('*').eq('id', 1).single();
            if (data) config = data;
            document.getElementById('admin-notes').value = localStorage.getItem('adm_notes') || '';
            sync(); setInterval(sync, 3000);
        }

        async function sync() {
            const { data: set } = await _supabase.from('settings').select('*').eq('id', 1).single();
            if (set) config = set;
            const sEl = document.getElementById('admin-status-text');
            sEl.innerText = config.admin_online ? "Admin Online" : "Admin Offline";
            sEl.className = config.admin_online ? "text-[10px] uppercase admin-status-on" : "text-[10px] uppercase text-red-500";
            
            if (currentUser) { updateQueue(); loadMessages(); }
            if (!document.getElementById('admin-screen').classList.contains('hidden-node')) { 
                loadAdmList();
                loadAdmChat(); 
            }
        }

        async function handleAuth() {
            let log = document.getElementById('login').value.trim();
            let pas = document.getElementById('pass').value.trim();
            let av = document.getElementById('avatar').value.trim() || '🚀';
            if(!log || !pas) return alert("Заполни поля!");
            if(!isLogin && !(/\p{Emoji}/u.test(av))) return alert("В аватар только эмодзи!");
            if(!log.startsWith('@')) log = '@' + log;

            if (isEditMode) {
                // РЕЖИМ РЕДАКТИРОВАНИЯ (UPDATE)
                const { data, error } = await _supabase.from('queue').update({ tg_login: log, password: pas, avatar: av }).eq('id', currentUser.id).select();
                if(error) return alert("Ошибка при сохранении!");
                currentUser = data[0];
                alert("Профиль обновлен!");
                closeProfile();
            } else if (isLogin) {
                // ВХОД
                const { data } = await _supabase.from('queue').select('*').eq('tg_login', log).eq('password', pas).single();
                if(!data) return alert("Неверно!"); currentUser = data;
                document.getElementById('auth-screen').classList.add('hidden-node');
                document.getElementById('main-screen').classList.remove('hidden-node');
            } else {
                // РЕГИСТРАЦИЯ
                const { data, error } = await _supabase.from('queue').insert([{ tg_login: log, password: pas, avatar: av }]).select();
                if(error) return alert("Логин уже занят!"); currentUser = data[0];
                document.getElementById('auth-screen').classList.add('hidden-node');
                document.getElementById('main-screen').classList.remove('hidden-node');
            }
            
            if(currentUser) {
                document.getElementById('u-avatar').innerText = currentUser.avatar;
                document.getElementById('u-name').innerText = currentUser.tg_login;
            }
        }

        function openProfileEdit() {
            isEditMode = true;
            document.getElementById('main-screen').classList.add('hidden-node');
            document.getElementById('auth-screen').classList.remove('hidden-node');
            document.getElementById('auth-title').innerText = "Профиль";
            document.getElementById('auth-main-btn').innerText = "СОХРАНИТЬ";
            document.getElementById('reg-fields').classList.remove('hidden-node');
            document.getElementById('mode-btn').classList.add('hidden-node');
            document.getElementById('cancel-btn').classList.remove('hidden-node');
            document.getElementById('login').value = currentUser.tg_login;
            document.getElementById('avatar').value = currentUser.avatar;
            document.getElementById('pass').value = currentUser.password;
        }

        function closeProfile() {
            isEditMode = false;
            document.getElementById('auth-screen').classList.add('hidden-node');
            document.getElementById('main-screen').classList.remove('hidden-node');
            document.getElementById('cancel-btn').classList.add('hidden-node');
            document.getElementById('mode-btn').classList.remove('hidden-node');
        }

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Войти" : "Регистрация";
            document.getElementById('auth-main-btn').innerText = "ОК";
            document.getElementById('reg-fields').classList.toggle('hidden-node', isLogin);
        }

        async function updateQueue() {
            const { data } = await _supabase.from('queue').select('*').order('created_at', { ascending: true });
            if(!data) return;
            const p = data.findIndex(i => i.id === currentUser.id) + 1;
            const posEl = document.getElementById('pos');
            posEl.innerText = p > 0 ? '#' + p : '#--';
            posEl.className = p === 1 ? "text-6xl font-black italic pos-first" : "text-6xl font-black italic";
            
            document.getElementById('vip-block').classList.toggle('hidden-node', p === 1 || p === 0);
            document.getElementById('tab-private').classList.toggle('hidden-node', p !== 1);
            
            document.getElementById('public-queue').innerHTML = data.map((u, i) => `<div>${i+1}. ${u.avatar} ${u.tg_login}</div>`).join('');
        }

        async function clearChatNow() {
            if(confirm("ТОЧНО ОЧИСТИТЬ ЧАТ?")) {
                const { error } = await _supabase.from('messages').delete().neq('id', -1);
                if(error) {
                    console.error(error);
                    alert("Ошибка при удалении. Попробуй еще раз.");
                } else {
                    alert("Чат полностью очищен!");
                }
            }
        }

        // Остальные функции без изменений
        async function loadMessages() {
            let query = _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if (activeTab === 'common') query = query.eq('is_private', false);
            else query = query.eq('is_private', true).or(`sender.eq.${currentUser.tg_login},receiver.eq.${currentUser.tg_login}`);
            const { data } = await query.limit(30);
            if(data) {
                document.getElementById('chat-box').innerHTML = data.map(m => `<div class="mb-1"><b class="${m.sender.includes('ADMIN')?'text-indigo-400':'text-gray-500'}">${m.sender}:</b> ${m.text}</div>`).join('');
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
            }
        }
        async function loadAdmChat() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { descending: true }).limit(20);
            if(data) document.getElementById('adm-chat-view').innerHTML = data.map(m => `<div><b>${m.sender}:</b> ${m.text} ${m.is_private ? '🔒' : ''}</div>`).join('');
        }
        async function sendMsg() {
            const t = document.getElementById('msg-input').value; if(!t) return;
            await _supabase.from('messages').insert([{ sender: currentUser.tg_login, text: t, is_private: (activeTab === 'private'), receiver: activeTab === 'private' ? '⭐ADMIN⭐' : null }]);
            document.getElementById('msg-input').value = '';
        }
        async function sendAdmMsg() {
            const t = document.getElementById('adm-msg').value; if(!t) return;
            const { data: q } = await _supabase.from('queue').select('tg_login').order('created_at', { ascending: true }).limit(1);
            if(q[0]) await _supabase.from('messages').insert([{ sender: '⭐ADMIN⭐', receiver: q[0].tg_login, text: t, is_private: true }]);
            document.getElementById('adm-msg').value = '';
        }
        async function sendAdmToAll() {
            const t = document.getElementById('adm-msg').value; if(!t) return;
            await _supabase.from('messages').insert([{ sender: '⭐ADMIN⭐', text: t, is_private: false }]);
            document.getElementById('adm-msg').value = '';
        }
        async function loadAdmList() {
            const { data } = await _supabase.from('queue').select('*').order('created_at', { ascending: true });
            if(data) {
                document.getElementById('first-user-name').innerText = data[0] ? data[0].tg_login : "...";
                document.getElementById('admin-list').innerHTML = data.map((u, i) => `
                    <div class="flex items-center justify-between bg-white/5 p-2 rounded-xl mb-1 border border-white/5">
                        <span>#${i+1} <b>${u.tg_login}</b></span>
                        <div class="flex gap-1">
                            <button onclick="moveUser('${u.id}', -1)" class="bg-white/10 px-2 rounded font-bold">↑</button>
                            <button onclick="moveUser('${u.id}', 1)" class="bg-white/10 px-2 rounded font-bold">↓</button>
                            <button onclick="delUser('${u.id}')" class="text-red-500 px-1 font-bold">×</button>
                        </div>
                    </div>
                `).join('');
            }
        }
        async function moveUser(id, dir) {
            const { data: q } = await _supabase.from('queue').select('*').order('created_at', { ascending: true });
            const idx = q.findIndex(u => u.id === id);
            if ((dir === -1 && idx === 0) || (dir === 1 && idx === q.length - 1)) return;
            const t = q[idx+dir], c = q[idx];
            await _supabase.from('queue').update({ created_at: t.created_at }).eq('id', c.id);
            await _supabase.from('queue').update({ created_at: c.created_at }).eq('id', target.id);
            loadAdmList();
        }
        function switchChat(tab) {
            activeTab = tab;
            document.getElementById('tab-common').className = `flex-1 pb-2 ${tab === 'common' ? 'tab-active' : 'text-gray-500'}`;
            document.getElementById('tab-private').className = `flex-1 pb-2 ${tab === 'private' ? 'tab-active' : 'text-gray-500'}`;
            loadMessages();
        }
        function checkSitePass() { if (document.getElementById('site-pass').value === "1234") { document.getElementById('site-lock').classList.add('hidden-node'); document.getElementById('auth-screen').classList.remove('hidden-node'); } else alert("!"); }
        function handleAdminClick() { clicks++; if(clicks >= 15) { const p = prompt("ПАРОЛЬ АДМИНА:"); if(p === "2010Max0102") { document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden-node')); document.getElementById('admin-screen').classList.remove('hidden-node'); } clicks = 0; } }
        function saveNotes() { localStorage.setItem('adm_notes', document.getElementById('admin-notes').value); }
        async function delUser(id) { if(confirm("Удалить пользователя из очереди?")) await _supabase.from('queue').delete().eq('id', id); }
        function buyVip(p, s) { window.open(`https://t.me/Maksim14215?text=VIP_${p}_для_${currentUser.tg_login}`, '_blank'); }
        init();
    </script>
</body>
</html>
